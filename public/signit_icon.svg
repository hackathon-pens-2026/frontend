<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="35%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Dark Lacquer Pen Body Gradient -->
    <linearGradient id="bodyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background with rounded squircle badge -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Dynamic Digital Stroke / Signature Ribbon forming S & Checkmark -->
  <!-- Understroke glow -->
  <path d="M 120 370 C 170 435, 270 440, 315 385 C 360 330, 270 290, 240 260 C 210 230, 220 180, 260 170 C 295 160, 345 195, 395 140" 
        fill="none" 
        stroke="#EAB308" 
        stroke-width="18" 
        stroke-linecap="round" 
        opacity="0.2" 
        filter="url(#goldGlow)"/>

  <!-- Main Signature Curve -->
  <path d="M 115 375 C 165 440, 275 440, 315 380 C 355 320, 270 280, 240 250 C 205 215, 215 175, 255 165 C 290 155, 335 185, 410 130" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="14" 
        stroke-linecap="round"/>

  <!-- Verified Digital Checkmark Accent -->
  <path d="M 285 375 L 330 420 L 440 295" 
        fill="none" 
        stroke="url(#cyanGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#goldGlow)"/>

  <!-- Fountain Pen Assembly (Tilted at precision angle 45 deg) -->
  <g transform="translate(190, 80) rotate(-18)">
    <!-- Pen Barrel Ring / Grip Section -->
    <rect x="-24" y="0" width="48" height="24" rx="4" fill="url(#bodyGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <rect x="-26" y="22" width="52" height="10" rx="3" fill="url(#goldGrad)"/>
    <rect x="-22" y="32" width="44" height="20" rx="2" fill="url(#bodyGrad)"/>
    <rect x="-25" y="50" width="50" height="7" rx="2" fill="url(#goldGrad)"/>

    <!-- Pen Nib Main Body -->
    <path d="M -22 57 
             C -22 80, -32 105, -30 135 
             C -28 155, -4 185, 0 192 
             C 4 185, 28 155, 30 135 
             C 32 105, 22 80, 22 57 
             Z" 
          fill="url(#bodyGrad)" 
          stroke="url(#goldGrad)" 
          stroke-width="3"/>

    <!-- Nib Golden Inlay & Wings -->
    <path d="M -16 65 
             C -16 85, -24 105, -22 130 
             C -20 146, -3 172, 0 178 
             C 3 172, 20 146, 22 130 
             C 24 105, 16 85, 16 65 
             Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="2.5"/>

    <!-- Center Slit & Heart Breather Hole -->
    <line x1="0" y1="95" x2="0" y2="192" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="95" r="5" fill="url(#goldGrad)"/>
    <circle cx="0" cy="95" r="2.5" fill="#0F172A"/>

    <!-- Pen Tip Ink Glow -->
    <circle cx="0" cy="192" r="4.5" fill="#38BDF8" filter="url(#goldGlow)"/>
  </g>

  <!-- Digital Spark / Dot Accent -->
  <circle cx="410" cy="130" r="5" fill="#FDE047"/>
  <circle cx="440" cy="295" r="6" fill="#38BDF8"/>
</svg>
